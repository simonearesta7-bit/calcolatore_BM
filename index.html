<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatore BMI</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body>

  <div class="card">
    <h1>Calcolatore BMI</h1>
    
    <form action="bmi.php" method="post">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" required>
      </div>

      <div class="form-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" name="peso" step="0.1" min="1" placeholder="Es. 70" required>
      </div>

      <div class="form-group">
        <label for="altezza">Altezza (cm)</label>
        <input type="number" id="altezza" name="altezza" step="1" min="1" placeholder="Es. 178" required>
      </div>

      <button type="submit">Calcola</button>
    </form>
  </div>

</body>
</html>
